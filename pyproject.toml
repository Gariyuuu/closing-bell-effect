[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "closingbell"
version = "0.1.0"
description = "Does an unusually strong final-30-minute price move persist or reverse overnight?"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "scikit-learn>=1.5",
    "exchange_calendars>=4.5",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
